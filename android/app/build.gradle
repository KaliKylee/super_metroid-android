apply plugin: 'com.android.application'

android {
    namespace 'com.raekwon.supermetroid'
    compileSdk 33
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId 'com.raekwon.supermetroid'
        minSdkVersion 21
        targetSdkVersion 33
        // Always increasing in CI so a new build can be installed over the old one
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '0.1'

        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-21'
                abiFilters 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'jni/Android.mk'
        }
    }

    // Release signing: the keystore comes from env vars set by the GitHub
    // Actions workflow (decoded from repository secrets). Nothing secret is
    // stored in the repo.
    signingConfigs {
        release {
            def ksFile = System.getenv('KEYSTORE_FILE')
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
