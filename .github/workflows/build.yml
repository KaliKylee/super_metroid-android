name: Build APK

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the obsolete 'tools'
          # package, which makes sdkmanager fail. We install what we need below.
          packages: ''

      - name: Install SDK platform and NDK
        run: |
          sdkmanager --install \
            "platforms;android-33" \
            "build-tools;33.0.1" \
            "ndk;27.3.13750724"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # The repo's wrapper jar (copied from SDL's android-project) is not in
          # Gradle's list of known checksums, so wrapper validation fails.
          # We install Gradle 8.4 (the version in gradle-wrapper.properties)
          # ourselves and run `gradle` directly, never executing that jar.
          validate-wrappers: false
          gradle-version: '8.4'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/SuperMetroid-touch-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperMetroid-touch-debug
          path: dist/SuperMetroid-touch-debug.apk
          if-no-files-found: error

      # Rolling release so the APK can be downloaded straight from the
      # Releases page (easy on a phone).
      - name: Move latest-build tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest-build
          git push -f origin latest-build

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          prerelease: true
          body: |
            Debug APK built manually via GitHub Actions (Run workflow).
            You need to provide your own Super Metroid ROM on first launch.
          files: dist/SuperMetroid-touch-debug.apk
